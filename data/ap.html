<!DOCTYPE html>
<html lang="id">
<head>
    <title>Pengaturan Access Point</title>
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <style>
        body { font-family: sans-serif; max-width: 400px; margin: 60px auto; padding: 0 20px; }
        input { display: block; width: 100%; padding: 10px; margin: 8px 0; box-sizing: border-box; }
        button { width: 100%; padding: 10px; background: #007bff; color: white; border: none; border-radius: 4px; }
        #error { color: #c0392b; margin-top: 8px; }
    </style>
</head>
<body>
    <h2>Pengaturan Access Point</h2>
    <form id="apForm">
        <input type="text" id="ssid" placeholder="SSID" required>
        <input autocomplete type="password" id="password" placeholder="password" required>
        <button type="submit">Simpan</button>
    </form>
    <div id="error"></div>

    <script>
        document.getElementById('apForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            const ssid = document.getElementById('ssid').value;
            const password = document.getElementById('password').value;
            const errorDiv = document.getElementById('error');

            const res = await fetch('/ap', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ ssid, password }),
                credentials: 'same-origin'
            });

            if (res.ok) {
                window.location.href = '/';
            } else {
                errorDiv.textContent = 'Gagal menyimpan kredensial AP: ' + await res.text();
            }
        });
    </script>
</body>
</html>

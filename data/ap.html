<!DOCTYPE html>
<html lang="id">
<head>
    <title>Pengaturan Access Point</title>
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <link href="/styles.css" rel="stylesheet" type="text/css">
</head>
<body>
    <a href="/" id="back">
    Kembali
    </a>
    <h2>Pengaturan Access Point</h2>
    <form id="apForm">
        <input type="text" id="ssid" placeholder="SSID" required>
        <input autocomplete type="password" id="password" placeholder="password" required>
        <button type="submit">Simpan</button>
    </form>
    <div id="error"></div>
    <div id="success"></div>

    <script>
        document.getElementById('apForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            const ssid = document.getElementById('ssid').value;
            const password = document.getElementById('password').value;
            const errorDiv = document.getElementById('error');
            const successDiv = document.getElementById('success');

            const res = await fetch('/ap', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ ssid, password }),
                credentials: 'same-origin'
            });

            if (res.ok) {
                successDiv.textContent = 'Berhasil menyimpan kredensial AP';
            } else {
                errorDiv.textContent = 'Gagal menyimpan kredensial AP: ' + await res.text();
            }
        });
    </script>
</body>
</html>

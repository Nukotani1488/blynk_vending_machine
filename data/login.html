<!DOCTYPE html>
<html lang="id">
<head>
    <title>Vending Machine Login</title>
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <style>
        body { font-family: sans-serif; max-width: 400px; margin: 60px auto; padding: 0 20px; }
        input { display: block; width: 100%; padding: 10px; margin: 8px 0; box-sizing: border-box; }
        button { width: 100%; padding: 10px; background: #007bff; color: white; border: none; border-radius: 4px; }
        #error { color: #c0392b; margin-top: 8px; }
    </style>
</head>
<body>
    <h2>Login Akun Admin</h2>
    <form id="loginForm">
        <input type="text" id="username" placeholder="Username" required>
        <input autocomplete type="password" id="password" placeholder="Password" required>
        <button type="submit">Login</button>
    </form>
    <div id="error"></div>

    <script>
        document.getElementById('loginForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            const username = document.getElementById('username').value;
            const password = document.getElementById('password').value;
            const errorDiv = document.getElementById('error');

            const res = await fetch('/login', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ username, password }),
                credentials: 'same-origin'
            });

            if (res.ok) {
                window.location.href = '/';
            } else {
                errorDiv.textContent = 'Login gagal: ' + await res.text();
            }
        });
    </script>
</body>
</html>

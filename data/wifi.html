<!DOCTYPE html>
<html lang="id">
<head>
    <title>Pengaturan WiFi</title>
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <style>
        body { font-family: sans-serif; max-width: 400px; margin: 60px auto; padding: 0 20px; }
        input { display: block; width: 100%; padding: 10px; margin: 8px 0; box-sizing: border-box; }
        button { width: 100%; padding: 10px; background: #007bff; color: white; border: none; border-radius: 4px; }
        #error { color: #c0392b; margin-top: 8px; }
        #success { color: green; margin-top: 8px; }
        #back {
            position:absolute;
            top:16px;left:16px;
            padding:8px 14px;
            background:#6c757d;
            color:#fff;
            text-decoration:none;
            border-radius:4px;
            font-size:14px;
            display:inline-block;
        }
    </style>
</head>
<body>
    <a href="/" id="back">Kembali</a>
    <h2>Pengaturan WiFi</h2>
    <form id="wifiForm">
        <input type="text" id="ssid" placeholder="SSID" required>
        <input autocomplete type="password" id="password" placeholder="password" required>
        <button type="submit">Simpan</button>
    </form>
    <div id="error"></div>
    <div id="success"></div>

    <script>
        document.getElementById('wifiForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            const ssid = document.getElementById('ssid').value;
            const password = document.getElementById('password').value;
            const errorDiv = document.getElementById('error');

            const res = await fetch('/wifi', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ ssid, password }),
                credentials: 'same-origin'
            });

            if (res.ok) {
                successDiv.textContent = 'Berhasil menyimpan kredensial WiFi';
            } else {
                errorDiv.textContent = 'Gagal menyimpan kredensial WiFi: ' + await res.text();
            }
        });
    </script>
</body>
</html>

<!DOCTYPE html>
<html lang="id">
<head>
  <title>Vending Machine Setup</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link href="/styles.css" rel="stylesheet" type="text/css">
</head>
<body>
  <h2>Setup Akun Admin</h2>
  <form id="setupForm">
    <input type="text" id="username" placeholder="Username" required>
    <input autocomplete type="password" id="password" placeholder="Password" required>
    <input autocomplete type="password" id="confirmPassword" placeholder="Konfirmasi Password" required>
    <button type="submit">Simpan</button>
  </form>
  <div id="error"></div>

  <script>
    document.getElementById('setupForm').addEventListener('submit', async (e) => {
      e.preventDefault();
      const username = document.getElementById('username').value;
      const password = document.getElementById('password').value;
      const confirmPassword = document.getElementById('confirmPassword').value;
      const errorDiv = document.getElementById('error');

      if (password !== confirmPassword) {
        errorDiv.textContent = "Password tidak cocok";
        return;
      }
      if (password.length < 8) {
        errorDiv.textContent = "Password harus minimal 8 karakter";
        return;
      }

      const res = await fetch('/setup', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ username, password, confirmPassword })
      });

      if (res.ok) {
        window.location.href = '/login';
      } else {
        errorDiv.textContent = 'Setup gagal: ' + await res.text();
      }
    });
  </script>
</body>
</html>

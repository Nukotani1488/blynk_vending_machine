<!DOCTYPE html>
<html lang="id">
<head>
    <title>Vending Machine</title>
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <link href="/styles.css" rel="stylesheet" type="text/css">
</head>
<body>
    <h1>Vending Machine</h1>
    <p>Selamat datang di Vending Machine!</p>

    <div class="grid">
        <a class="tile" href="/wifi">WiFi</a>
        <a class="tile" href="/ap">Access Point</a>
        <a class="tile" href="/blynk">Blynk</a>
        <a class="tile" href="/harga">Harga</a>
    </div>
    <button type="submit" id="logout">Logout</button>
    <div id="error"></div>
    <script>
        document.getElementById('logout').addEventListener('click', async (e) => {
        e.preventDefault();
        const errorDiv = document.getElementById('error');

        const res = await fetch('/logout', {
            method: 'POST',
            credentials: 'same-origin'
        });

        if (res.ok) {
            window.location.href = '/login';
        } else {
            errorDiv.textContent = 'Logout gagal: ' + await res.text();
        }
    });
    </script>
</body>
</html>

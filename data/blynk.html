<!DOCTYPE html>
<html lang="id">
<head>
    <title>Pengaturan Blynk</title>
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <link href="/styles.css" rel="stylesheet" type="text/css">
</head>
<body>
    <a href="/" id="back">Kembali</a>
    <h2>Pengaturan Blynk</h2>
    <form id="blynkForm">
        <input type="text" id="token" placeholder="token autentikasi" required>
        <button type="submit">Simpan</button>
    </form>
    <div id="error"></div>
    <div id="success"></div>

    <script>
        document.getElementById('blynkForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            const token = document.getElementById('token').value;
            const errorDiv = document.getElementById('error');
            const successDiv = document.getElementById('success');

            const res = await fetch('/blynk', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ token }),
                credentials: 'same-origin'
            });

            if (res.ok) {
                successDiv.textContent = 'Berhasil menyimpan token';
            } else {
                errorDiv.textContent = 'Gagal menyimpan token: ' + await res.text();
            }
        });
    </script>
</body>
</html>
